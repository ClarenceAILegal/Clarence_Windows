# Fly.io app config for Clarence (clarenceai.live)
# After: fly auth login && fly launch --no-deploy
# Then set secrets and deploy (see DEPLOY.md)

app = 'clarence-ai'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
