relief_sought: an order compelling Defendant to serve verified responses to Plaintiff's
  First Set of Interrogatories and produce documents responsive to Plaintiff's First
  Request for Production
factual_background: On March 1, 2026, Plaintiff served written discovery on Defendant.
  Responses were due April 1, 2026. Despite a good-faith meet-and-confer on April
  10, 2026, Defendant has not served responses or produced documents.
legal_argument: A party may move to compel discovery when the opposing party fails
  to respond. Defendant's failure prejudices Plaintiff's ability to prepare for trial.
  The Court should compel responses and award reasonable expenses.
prayer_for_relief: 'WHEREFORE, Movant respectfully requests that this Court enter
  an order: (1) compelling full discovery responses within 14 days; (2) awarding reasonable
  expenses including attorney''s fees; and (3) granting such other relief as the Court
  deems just and proper.'
certificate_of_service: I certify that on the filing date a true and correct copy
  of this Motion was served on all counsel of record via the Court's electronic filing
  system.
