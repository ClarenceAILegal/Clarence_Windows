<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Motion Bot{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  {% if authed %}
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="/dashboard">Motion Bot</a>
      <div class="nav-links">
        <a href="/dashboard">Templates</a>
        <a href="/generate">Generate</a>
        <a href="/upload">Upload</a>
        <form method="post" action="/logout" style="display:inline;margin:0;">
          <button class="linkish" type="submit">Log out</button>
        </form>
      </div>
    </nav>

    {% for f in flashes %}
      <div class="flash {{ f.level }}">{{ f.message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}

    <footer class="footer">Private site · v{{ version }} · generated documents stay on this server</footer>
  </div>
  {% else %}
    {% block public %}{% endblock %}
  {% endif %}
</body>
</html>
