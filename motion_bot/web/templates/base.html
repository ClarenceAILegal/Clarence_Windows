<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Clarence{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="app-page">
  {% if play_intro %}
  <div class="intro-veil" id="intro-veil"></div>
  {% endif %}
  <canvas id="graphene-lattice" aria-hidden="true"></canvas>
  <canvas id="future-ripples"></canvas>

  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-stack">
        <a class="logo" href="/home">Clarence</a>
        <button
          type="button"
          class="menu-toggle"
          id="menu-toggle"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="site-menu"
        >
          <svg
            class="bear-icon"
            viewBox="0 0 32 32"
            width="28"
            height="28"
            aria-hidden="true"
            focusable="false"
          >
            <!-- ears -->
            <circle class="bear-ear" cx="7.5" cy="8.5" r="4.2" />
            <circle class="bear-ear" cx="24.5" cy="8.5" r="4.2" />
            <circle class="bear-ear-inner" cx="7.5" cy="8.5" r="2.1" />
            <circle class="bear-ear-inner" cx="24.5" cy="8.5" r="2.1" />
            <!-- head -->
            <circle class="bear-head" cx="16" cy="17" r="10.5" />
            <!-- angry brows -->
            <path class="bear-brow" d="M9.2 13.2 L14.2 15.1" />
            <path class="bear-brow" d="M22.8 13.2 L17.8 15.1" />
            <!-- eyes -->
            <circle class="bear-eye" cx="12.2" cy="16.8" r="1.35" />
            <circle class="bear-eye" cx="19.8" cy="16.8" r="1.35" />
            <!-- snout -->
            <ellipse class="bear-snout" cx="16" cy="21.2" rx="4.2" ry="3.1" />
            <!-- nose -->
            <ellipse class="bear-nose" cx="16" cy="20.3" rx="1.5" ry="1.15" />
            <!-- frown -->
            <path class="bear-mouth" d="M13.4 23.1 Q16 21.6 18.6 23.1" />
          </svg>
        </button>
        <nav class="site-menu" id="site-menu" aria-label="Main">
          <div class="site-menu-inner">
            <a class="menu-item" href="/home" style="--i:0">Search</a>
            <a class="menu-item" href="/library" style="--i:1">Library</a>
            <a class="menu-item" href="/generate" style="--i:2">Generate</a>
            <a class="menu-item" href="/upload" style="--i:3">Upload</a>
            <form class="menu-item menu-logout" method="post" action="/logout" style="--i:4">
              <button class="linkish" type="submit">Log out</button>
            </form>
          </div>
        </nav>
      </div>
    </header>

    {% for f in flashes %}
      <div class="flash {{ f.level }}">{{ f.message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}

    <footer class="footer">Private · v{{ version }}</footer>
  </div>

  <script src="/static/lattice.js"></script>
  <script src="/static/ripples.js"></script>
  <script>
    (function () {
      // Collapsible vertical menu under logo
      const toggle = document.getElementById("menu-toggle");
      const menu = document.getElementById("site-menu");
      if (toggle && menu) {
        function setOpen(open) {
          toggle.classList.toggle("is-open", open);
          menu.classList.toggle("is-open", open);
          toggle.setAttribute("aria-expanded", open ? "true" : "false");
          toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
        }
        toggle.addEventListener("click", function (e) {
          e.stopPropagation();
          setOpen(!menu.classList.contains("is-open"));
        });
        document.addEventListener("click", function (e) {
          if (!menu.classList.contains("is-open")) return;
          if (toggle.contains(e.target) || menu.contains(e.target)) return;
          setOpen(false);
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") setOpen(false);
        });
      }

      // Undulating graphene lattice (auth-gated shell only)
      if (window.MotionBotLattice) {
        window.MotionBotLattice.start(document.getElementById("graphene-lattice"));
      }

      // Optional soft ripples after password unlock (subtle; lattice is main field)
      const canvas = document.getElementById("future-ripples");
      if (!canvas || !window.MotionBotRipples) return;

      {% if play_intro %}
      const engine = window.MotionBotRipples.create(canvas, {
        ambient: false,
        interactive: false,
        waveColor: [210, 120, 120],
        clearAlpha: 0.04,
      });
      setTimeout(function () {
        engine.splash(window.innerWidth * 0.5, window.innerHeight * 0.42, 1.0);
      }, 200);
      setTimeout(function () {
        const veil = document.getElementById("intro-veil");
        if (veil) veil.remove();
      }, 1700);
      {% endif %}
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
