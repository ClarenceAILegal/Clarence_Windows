<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="login-page" id="login-body">
  <!-- Full-page fluid undulation (idle until correct password) -->
  <canvas id="undulate-canvas" class="undulate-canvas-idle" aria-hidden="true"></canvas>

  <form class="login-center" id="login-form" method="post" action="/login" autocomplete="off">
    <label for="password">Password:</label>
    <input
      id="password"
      name="password"
      type="password"
      maxlength="64"
      autofocus
      required
      spellcheck="false"
    />
  </form>

  {% if error %}
  <div class="login-error" id="login-error">{{ error }}</div>
  {% else %}
  <div class="login-error" id="login-error" hidden></div>
  {% endif %}

  <script src="/static/login-undulate.js"></script>
  <script>
    (function () {
      var form = document.getElementById("login-form");
      var input = document.getElementById("password");
      var err = document.getElementById("login-error");
      var body = document.getElementById("login-body");
      var canvas = document.getElementById("undulate-canvas");
      var unlocking = false;

      function showError(msg) {
        err.hidden = false;
        err.textContent = msg;
        input.select();
      }

      function playUnlockUndulation() {
        body.classList.add("login-undulating");
        if (window.LoginUndulate) {
          window.LoginUndulate.start(canvas, {
            durationMs: 2500,
            onComplete: function () {
              window.location.href = "/home?awakened=1";
            },
          });
        } else {
          window.location.href = "/home?awakened=1";
        }
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        if (unlocking) return;

        err.hidden = true;
        err.textContent = "";

        var bodyData = new URLSearchParams();
        bodyData.set("password", input.value);

        var res;
        try {
          res = await fetch("/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              Accept: "application/json",
            },
            body: bodyData.toString(),
            credentials: "same-origin",
          });
        } catch (ex) {
          showError("Unable to reach server.");
          return;
        }

        if (!res.ok) {
          var msg = "Incorrect password.";
          try {
            var data = await res.json();
            if (data && data.error) msg = data.error;
          } catch (_) {}
          showError(msg);
          return;
        }

        unlocking = true;
        input.disabled = true;
        playUnlockUndulation();
      });
    })();
  </script>
</body>
</html>
