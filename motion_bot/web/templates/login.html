<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password</title>
  <link rel="stylesheet" href="/static/style.css?v=login-rawr-1" />
  <style>
    html, body.login-page {
      background: #000080 !important;
      min-height: 100vh;
    }
  </style>
</head>
<body class="login-page" id="login-body" style="background:#000080;">
  <canvas id="login-lattice" aria-hidden="true"></canvas>
  <div class="login-fade-overlay" id="login-fade" aria-hidden="true"></div>

  <!-- Unlock hero: giant bear + speech bubble -->
  <div class="login-rawr-stage" id="rawr-stage" aria-hidden="true">
    <div class="login-rawr-cluster" id="rawr-cluster">
      <div class="login-rawr-bear-wrap" id="rawr-bear-wrap">
        <svg
          class="login-rawr-bear"
          viewBox="0 0 32 32"
          width="100%"
          height="100%"
          aria-hidden="true"
          focusable="false"
        >
          <circle class="bear-ear" cx="7.5" cy="8.5" r="4.2" />
          <circle class="bear-ear" cx="24.5" cy="8.5" r="4.2" />
          <circle class="bear-ear-inner" cx="7.5" cy="8.5" r="2.1" />
          <circle class="bear-ear-inner" cx="24.5" cy="8.5" r="2.1" />
          <circle class="bear-head" cx="16" cy="17" r="10.5" />
          <path class="bear-brow" d="M9.2 13.2 L14.2 15.1" />
          <path class="bear-brow" d="M22.8 13.2 L17.8 15.1" />
          <circle class="bear-eye" cx="12.2" cy="16.8" r="1.35" />
          <circle class="bear-eye" cx="19.8" cy="16.8" r="1.35" />
          <ellipse class="bear-snout" cx="16" cy="21.2" rx="4.2" ry="3.1" />
          <ellipse class="bear-nose" cx="16" cy="20.3" rx="1.5" ry="1.15" />
          <path class="bear-mouth" d="M13.4 23.1 Q16 21.6 18.6 23.1" />
        </svg>
      </div>
      <div class="login-rawr-bubble" id="rawr-bubble" role="img" aria-label="rawr.">
        <span class="login-rawr-text">rawr.</span>
        <span class="login-rawr-tail" aria-hidden="true"></span>
      </div>
    </div>
  </div>

  <form class="login-center" id="login-form" method="post" action="/login" autocomplete="off">
    <label for="password">Password:</label>
    <input
      id="password"
      name="password"
      type="password"
      maxlength="64"
      autofocus
      required
      spellcheck="false"
    />
  </form>

  {% if error %}
  <div class="login-error" id="login-error">{{ error }}</div>
  {% else %}
  <div class="login-error" id="login-error" hidden></div>
  {% endif %}

  <script src="/static/bear-lattice.js?v=login-rawr-1"></script>
  <script>
    (function () {
      var form = document.getElementById("login-form");
      var input = document.getElementById("password");
      var err = document.getElementById("login-error");
      var body = document.getElementById("login-body");
      var fade = document.getElementById("login-fade");
      var canvas = document.getElementById("login-lattice");
      var stage = document.getElementById("rawr-stage");
      var cluster = document.getElementById("rawr-cluster");
      var bubble = document.getElementById("rawr-bubble");
      var unlocking = false;

      var lattice = null;
      function startLattice() {
        if (!window.MotionBotBearLattice || !canvas) {
          console.error("Clarence: bear lattice failed to load");
          return;
        }
        lattice = window.MotionBotBearLattice.start(canvas, {
          intensity: 1.15,
          speed: 1,
        });
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startLattice);
      } else {
        startLattice();
      }

      function showError(msg) {
        err.hidden = false;
        err.textContent = msg;
        input.select();
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }
      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }
      function easeOutBack(t) {
        var c1 = 1.70158;
        var c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }
      function clamp01(t) {
        return Math.max(0, Math.min(1, t));
      }

      /**
       * Timeline (ms):
       * 0–900     giant bear grows in from tiny, lattice softens
       * 750–1400  speech bubble pops in with "rawr."
       * 1400–1900 hold / gentle breath
       * 1900–3200 white veil + fade out of bear/bubble → main app
       */
      function playUnlockSequence() {
        body.classList.add("login-unlocking");
        stage.setAttribute("aria-hidden", "false");
        stage.classList.add("is-active");

        var start = performance.now();
        var total = 3200;

        function tick(now) {
          var elapsed = now - start;
          var p = clamp01(elapsed / total);

          // --- Phase fractions ---
          var growP = clamp01(elapsed / 900);
          var bubbleP = clamp01((elapsed - 750) / 550);
          var holdBreath = 0.5 + 0.5 * Math.sin((elapsed / 1000) * Math.PI * 1.4);
          var fadeP = clamp01((elapsed - 1900) / 1300);

          // Bear scale: tiny → huge (covers most of viewport)
          var growE = easeOutCubic(growP);
          // overshoot slightly then settle
          var scale =
            growP < 1
              ? 0.08 + growE * 0.98
              : 1.06 + (holdBreath - 0.5) * 0.03;
          // soft drop-in from slightly below center
          var rise = (1 - growE) * 28;
          // Fade out bear/bubble with the white veil
          var heroOpacity = 1 - easeInOutCubic(fadeP);
          // Lattice fades under the hero
          var latticeFade = clamp01(growP * 1.2);

          if (cluster) {
            cluster.style.setProperty("--rawr-scale", String(scale));
            cluster.style.setProperty("--rawr-rise", rise.toFixed(2) + "px");
            cluster.style.opacity = String(heroOpacity);
          }

          // Bubble: scale + fade with back-ease pop
          if (bubble) {
            var bE = bubbleP <= 0 ? 0 : easeOutBack(Math.min(1, bubbleP));
            var bScale = Math.max(0, bE);
            var bOpacity = clamp01(bubbleP * 1.4) * heroOpacity;
            bubble.style.setProperty("--bubble-scale", String(bScale));
            bubble.style.opacity = String(bOpacity);
            if (bubbleP > 0) bubble.classList.add("is-visible");
          }

          // Soften lattice as hero takes over; slight thrash at start
          if (lattice) {
            lattice.setIntensity(1.1 + growP * 0.8 * (1 - fadeP));
            lattice.setSpeed(1 + growP * 0.4);
          }
          if (canvas) {
            canvas.style.opacity = String(Math.max(0, 1 - latticeFade * 0.85 - fadeP));
          }

          // White veil → main Clarence screen
          if (fade) {
            var veil = easeInOutCubic(fadeP);
            fade.style.opacity = String(veil);
          }

          if (p < 1) {
            requestAnimationFrame(tick);
          } else {
            window.location.href = "/home?awakened=1";
          }
        }
        requestAnimationFrame(tick);
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        if (unlocking) return;

        err.hidden = true;
        err.textContent = "";

        var bodyData = new URLSearchParams();
        bodyData.set("password", input.value);

        var res;
        try {
          res = await fetch("/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              Accept: "application/json",
            },
            body: bodyData.toString(),
            credentials: "same-origin",
          });
        } catch (ex) {
          showError("Unable to reach server.");
          return;
        }

        if (!res.ok) {
          var msg = "Incorrect password.";
          try {
            var data = await res.json();
            if (data && data.error) msg = data.error;
          } catch (_) {}
          showError(msg);
          return;
        }

        unlocking = true;
        input.disabled = true;
        playUnlockSequence();
      });
    })();
  </script>
</body>
</html>
