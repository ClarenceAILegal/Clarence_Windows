<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="login-page" id="login-body">
  <!-- Canvas stays hidden and empty until the password is verified -->
  <canvas id="ripple-canvas" class="ripple-canvas-idle" aria-hidden="true"></canvas>

  <form class="login-center" id="login-form" method="post" action="/login" autocomplete="off">
    <label for="password">Password:</label>
    <input
      id="password"
      name="password"
      type="password"
      maxlength="64"
      autofocus
      required
      spellcheck="false"
    />
  </form>

  {% if error %}
  <div class="login-error" id="login-error">{{ error }}</div>
  {% else %}
  <div class="login-error" id="login-error" hidden></div>
  {% endif %}

  <script>
    (function () {
      const form = document.getElementById("login-form");
      const input = document.getElementById("password");
      const err = document.getElementById("login-error");
      const body = document.getElementById("login-body");
      const canvas = document.getElementById("ripple-canvas");
      let unlocking = false;

      function showError(msg) {
        err.hidden = false;
        err.textContent = msg;
        input.select();
      }

      function loadRippleScript() {
        return new Promise(function (resolve, reject) {
          if (window.MotionBotRipples) {
            resolve();
            return;
          }
          const s = document.createElement("script");
          s.src = "/static/ripples.js";
          s.onload = function () { resolve(); };
          s.onerror = function () { reject(new Error("ripple script failed")); };
          document.head.appendChild(s);
        });
      }

      async function playSuccessRipples() {
        await loadRippleScript();
        canvas.classList.remove("ripple-canvas-idle");
        canvas.classList.add("active");
        const engine = window.MotionBotRipples.create(canvas, {
          waveColor: [200, 230, 255],
          ambient: false,
          interactive: false,
        });
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        // Only after correct password: stone-in-water rings
        engine.splash(cx, cy, 1.25);
        setTimeout(function () { engine.splash(cx - 40, cy + 20, 0.7); }, 180);
        setTimeout(function () { engine.splash(cx + 55, cy - 10, 0.55); }, 360);
        body.classList.add("login-fade-out");
        setTimeout(function () {
          window.location.href = "/home?awakened=1";
        }, 1450);
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        if (unlocking) return;

        err.hidden = true;
        err.textContent = "";

        const bodyData = new URLSearchParams();
        bodyData.set("password", input.value);

        let res;
        try {
          res = await fetch("/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              "Accept": "application/json",
            },
            body: bodyData.toString(),
            credentials: "same-origin",
          });
        } catch (ex) {
          showError("Unable to reach server.");
          return;
        }

        if (!res.ok) {
          let msg = "Incorrect password.";
          try {
            const data = await res.json();
            if (data && data.error) msg = data.error;
          } catch (_) {}
          showError(msg);
          return;
        }

        // Correct password only from here
        unlocking = true;
        input.disabled = true;
        try {
          await playSuccessRipples();
        } catch (_) {
          window.location.href = "/home?awakened=1";
        }
      });
    })();
  </script>
</body>
</html>
