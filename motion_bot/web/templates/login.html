<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password</title>
  <link rel="stylesheet" href="/static/style.css?v=login-blue-lattice-3" />
  <style>
    /* Hard guarantee if an old stylesheet is cached */
    html, body.login-page {
      background: #000080 !important;
      min-height: 100vh;
    }
  </style>
</head>
<body class="login-page" id="login-body" style="background:#000080;">
  <canvas id="login-lattice" aria-hidden="true"></canvas>
  <div class="login-fade-overlay" id="login-fade" aria-hidden="true"></div>

  <form class="login-center" id="login-form" method="post" action="/login" autocomplete="off">
    <label for="password">Password:</label>
    <input
      id="password"
      name="password"
      type="password"
      maxlength="64"
      autofocus
      required
      spellcheck="false"
    />
  </form>

  {% if error %}
  <div class="login-error" id="login-error">{{ error }}</div>
  {% else %}
  <div class="login-error" id="login-error" hidden></div>
  {% endif %}

  <script src="/static/lattice.js?v=login-blue-lattice-3"></script>
  <script>
    (function () {
      var form = document.getElementById("login-form");
      var input = document.getElementById("password");
      var err = document.getElementById("login-error");
      var body = document.getElementById("login-body");
      var fade = document.getElementById("login-fade");
      var canvas = document.getElementById("login-lattice");
      var unlocking = false;

      // Same undulating lattice as the main page, blue theme
      var lattice = null;
      function startLattice() {
        if (!window.MotionBotLattice || !canvas) {
          console.error("Clarence: lattice failed to load");
          return;
        }
        lattice = window.MotionBotLattice.start(canvas, {
          theme: "login",
          intensity: 1.15,
          speed: 1,
        });
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startLattice);
      } else {
        startLattice();
      }

      function showError(msg) {
        err.hidden = false;
        err.textContent = msg;
        input.select();
      }

      function playUnlockSequence() {
        body.classList.add("login-unlocking");
        var start = performance.now();
        var duration = 2600;

        function ramp(now) {
          var p = Math.min(1, (now - start) / duration);
          // Ease-in so undulation grows more dramatic toward the end
          var ease = p * p;
          var intensity = 1 + ease * 5.5; // 1 → ~6.5
          var speed = 1 + ease * 1.8;     // quicker waves as we unlock
          if (lattice) {
            lattice.setIntensity(intensity);
            lattice.setSpeed(speed);
          }
          // Fluid white veil rises as undulation peaks
          if (fade) {
            var veil = Math.max(0, (p - 0.35) / 0.65);
            veil = veil * veil;
            fade.style.opacity = String(veil);
          }
          if (p < 1) {
            requestAnimationFrame(ramp);
          } else {
            window.location.href = "/home?awakened=1";
          }
        }
        requestAnimationFrame(ramp);
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        if (unlocking) return;

        err.hidden = true;
        err.textContent = "";

        var bodyData = new URLSearchParams();
        bodyData.set("password", input.value);

        var res;
        try {
          res = await fetch("/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              Accept: "application/json",
            },
            body: bodyData.toString(),
            credentials: "same-origin",
          });
        } catch (ex) {
          showError("Unable to reach server.");
          return;
        }

        if (!res.ok) {
          var msg = "Incorrect password.";
          try {
            var data = await res.json();
            if (data && data.error) msg = data.error;
          } catch (_) {}
          showError(msg);
          return;
        }

        unlocking = true;
        input.disabled = true;
        playUnlockSequence();
      });
    })();
  </script>
</body>
</html>
