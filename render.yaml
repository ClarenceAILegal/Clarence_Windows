services:
  - type: web
    name: clarence
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn motion_bot.web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MOTION_BOT_PASSWORD
        sync: false
      - key: MOTION_BOT_SECRET_KEY
        generateValue: true
      - key: MOTION_BOT_HTTPS
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.8"
