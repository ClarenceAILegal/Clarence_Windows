[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-bot"
version = "0.1.0"
description = "Generate court motions as Word documents from LexisNexis-sourced templates"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "python-docx>=1.1.2",
  "docxtpl>=0.19.0",
  "click>=8.1.7",
  "PyYAML>=6.0.2",
]

[project.scripts]
motion-bot = "motion_bot.cli:main"

[tool.setuptools.packages.find]
include = ["motion_bot*"]
