[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-bot"
version = "0.1.0"
description = "Generate court motions as Word documents from local motion templates"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "python-docx>=1.1.2",
  "docxtpl>=0.19.0",
  "click>=8.1.7",
  "PyYAML>=6.0.2",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "jinja2>=3.1.4",
  "itsdangerous>=2.2.0",
  "openai>=1.40.0",
  "pywebview>=5.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
motion-bot = "motion_bot.cli:main"

[tool.setuptools.packages.find]
include = ["motion_bot*"]

[tool.setuptools.package-data]
motion_bot = ["web/templates/*", "web/static/*.css", "web/static/*.js"]
